# Real, confirmed-on-hardware gap this closes: this image's rpi-swap
# config shipped with everything commented out (Mechanism=auto but
# effectively inert) and zram-generator.conf.d explicitly disabling
# zram0 (host-memory-limit=0, fs-type=none) unless something else
# opts in — meaning NO swap at all was active on real hardware. On a
# 512MB-RAM, quad-core Pi Zero 2 W, bettercap (Go, real 4-core-aware
# GOMAXPROCS) + the Go pwnagotchi daemon + the Python plugin bridge +
# the freshly DKMS-built nexmon module all starting concurrently at
# boot is a real, plausible way to exhaust memory with zero cushion —
# something the QEMU-chroot build environment never exercises, since
# it only installs these services, never actually runs them.
[Main]
Mechanism=zram

[Zram]
RamMultiplier=1
MaxSizeMiB=512
