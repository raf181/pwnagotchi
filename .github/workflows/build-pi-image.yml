name: Build Raspberry Pi image

# Builds a flashable Raspberry Pi OS Lite (64-bit/arm64) .img.xz with the
# Go pwnagotchi daemon, bettercap, and pwngrid pre-installed and their
# systemd services enabled — see deploy/README.md for the full
# architecture, what's verified vs. unverified, and the real, disclosed
# WiFi-monitor-mode/nexmon gap this image does NOT attempt to close.
#
# This has NOT been run end-to-end against real Pi Zero 2 W hardware from
# the environment that authored it — read deploy/README.md's
# "Status" section before trusting a build artifact from this workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - go-rebuild
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build-pi-image.yml"

jobs:
  build-pwnagotchi:
    name: Cross-compile pwnagotchi (linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build linux/arm64 binary
        run: |
          # This module has no cgo dependencies (verified directly — see
          # deploy/pi-gen-stage/00-install-golang's doc comment for why
          # that's NOT also true of bettercap, which is built separately,
          # natively, inside the pi-gen chroot).
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o pwnagotchi-go ./cmd/pwnagotchi
          file pwnagotchi-go

      - uses: actions/upload-artifact@v7
        with:
          name: pwnagotchi-go-arm64
          path: pwnagotchi-go
          retention-days: 14

  build-image:
    name: Build pi-gen image
    needs: build-pwnagotchi
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo

      - uses: actions/download-artifact@v8
        with:
          name: pwnagotchi-go-arm64
          path: artifacts

      - name: Free up runner disk space
        # pi-gen builds a full Debian-based rootfs image; the hosted
        # runner's preinstalled toolchains (Android SDK, .NET, several
        # GHC/Haskell copies, etc.) aren't needed here and easily account
        # for several GB — removing them is a standard, well-established
        # pattern for disk-hungry GitHub Actions jobs, not specific to
        # this workflow.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Install pi-gen's own real dependencies (build.sh, not build-docker.sh)
        # Real, confirmed finding (not a guess): pi-gen's build-docker.sh
        # wraps the whole build in an ADDITIONAL, nested --privileged
        # Docker container. Two different binfmt_misc registration
        # mechanisms (apt's qemu-user-binfmt postinst, and separately
        # docker/setup-qemu-action's tonistiigi/binfmt "F"-flag registration)
        # both registered successfully on the runner but real arm64
        # execution INSIDE that nested container still failed identically
        # both times ("arm64: not supported on this machine/kernel", from
        # pi-gen's own arch-test check) — this is a documented
        # Docker-in-Docker binfmt limitation other projects hit too (see
        # e.g. armbian/build#8154, where the maintainers confirm
        # "Docker-in-Docker is not supported" for exactly this reason and
        # that their own real GitHub Actions builds run directly on the
        # runner VM, not nested in Docker).
        #
        # GitHub Actions' hosted runners ARE real (Ubuntu) VMs, not
        # containers — so running pi-gen's build.sh DIRECTLY (no Docker
        # wrapper at all) avoids the nesting problem entirely. This
        # installs exactly pi-gen's own documented dependency list
        # (arm64-branch `depends` file) instead of relying on
        # build-docker.sh's bundled Dockerfile to provide them.
        run: |
          sudo apt-get update
          # qemu-user-binfmt and qemu-user-static CONFLICT with each
          # other on this Ubuntu release (confirmed via a real failed
          # run: "qemu-user-binfmt : Conflicts: qemu-user-static" /
          # vice versa, apt refusing to install both). qemu-user-static
          # is the one that actually matters: it provides the real
          # static qemu-aarch64-static binary debootstrap's own
          # cross-arch bootstrap step needs to copy into the target
          # rootfs for second-stage chroot execution (confirmed via an
          # earlier failed run without it: "E: Unable to execute target
          # architecture"), and its own postinst does real binfmt_misc
          # registration too, same as qemu-user-binfmt would have.
          sudo apt-get install -y \
            quilt parted coreutils qemu-user-static debootstrap zerofree zip \
            dosfstools e2fsprogs libcap2-bin libarchive-tools grep rsync \
            xz-utils curl xxd file git kmod bc gpg pigz arch-test
          sudo modprobe binfmt_misc || true
          grep -q /proc/sys/fs/binfmt_misc /proc/mounts || sudo mount binfmt_misc -t binfmt_misc /proc/sys/fs/binfmt_misc
          test -x /usr/bin/qemu-aarch64-static
          # pi-gen's own dependencies_check (scripts/dependencies_check,
          # run inside build.sh) probes for a BARE `qemu-arm` binary as
          # its proxy for "is qemu-user support installed" (real content:
          # `hash qemu-arm`, suggesting the qemu-user-binfmt package by
          # name if missing) — confirmed via a real failed run
          # ("Required dependencies not installed... qemu-user-binfmt")
          # even though real arm64 emulation already works via
          # qemu-user-static's -static-suffixed binaries. Rather than
          # reinstall the conflicting package, symlink the bare names it
          # actually checks for.
          test -x /usr/bin/qemu-arm-static
          sudo ln -sf /usr/bin/qemu-aarch64-static /usr/bin/qemu-aarch64
          sudo ln -sf /usr/bin/qemu-arm-static /usr/bin/qemu-arm
          hash qemu-arm
          # Fail fast here (seconds) instead of after a ~90min build if
          # emulation genuinely doesn't work on this runner for some
          # other reason.
          arch-test arm64

      - name: Check out pi-gen (arm64 branch, pinned)
        # Pinned to a specific commit (not a floating branch tip) for two
        # reasons: reproducibility, and so the actions/cache key below is
        # stable across runs — a floating `--branch arm64` clone would
        # silently invalidate the cache (or worse, use a stale one against
        # newer upstream stage scripts) whenever upstream pushes. Bump this
        # SHA deliberately, not silently, same as BETTERCAP_REF.
        env:
          PI_GEN_REF: ca8aeed0ae300c2a89f55ce9617d5f96a27e99e5
        run: |
          git clone https://github.com/RPi-Distro/pi-gen.git pi-gen
          git -C pi-gen checkout "${PI_GEN_REF}"
          # pi-gen's own stage2 ships an EXPORT_IMAGE marker (that's how
          # the standard "Raspberry Pi OS Lite" build produces its own
          # image) — since our STAGE_LIST includes stage2 as a base to
          # build on top of, without this it would ALSO export a
          # redundant plain-lite image before continuing on to our
          # pwnagotchi stage, wasting real build time/disk for an
          # artifact we don't want. SKIP_IMAGES is pi-gen's own
          # documented mechanism for suppressing that.
          touch pi-gen/stage2/SKIP_IMAGES

      - name: Cache pi-gen work directory (skips stage0-2 rebuild when unchanged)
        # stage0/prerun.sh only re-runs debootstrap when its ROOTFS_DIR
        # doesn't already exist — pre-populating work/ from a previous
        # run's cache is pi-gen's own supported pattern for iterative
        # local development (see their README), not a hack specific to
        # this workflow. This is the single biggest cost in the whole
        # build (~15-20 of the ~44 min stage0-2 takes is debootstrap
        # alone, plus stage1/2's own package downloads) and it is 100%
        # independent of anything in deploy/pi-gen-stage, so
        # caching it lets iteration on OUR stage skip redoing it.
        # Keyed on the pinned pi-gen commit + RELEASE so a bump of either
        # correctly invalidates the cache instead of reusing stale state.
        uses: actions/cache@v4
        with:
          path: pi-gen/work
          key: pi-gen-work-ca8aeed0ae300c2a89f55ce9617d5f96a27e99e5-trixie

      - name: Write pi-gen config
        # Running build.sh directly (not build-docker.sh) means there's
        # no separate container filesystem to stage files into first —
        # real absolute runner paths work directly, including for
        # STAGE_LIST (documented to accept arbitrary paths, not just
        # ones under pi-gen's own tree).
        run: |
          cat > pi-gen/config <<EOF
          IMG_NAME=pwnagotchi
          # The arm64 branch's stage0/prerun.sh expects specifically
          # "trixie" (Debian 13) - confirmed via a real run's own
          # warning: "RELEASE does not match the intended option for
          # this branch" when this was set to bookworm.
          RELEASE=trixie
          DEPLOY_COMPRESSION=xz
          ENABLE_SSH=1
          STAGE_LIST="./stage0 ./stage1 ./stage2 ${GITHUB_WORKSPACE}/repo/deploy/pi-gen-stage"
          export PWNAGOTCHI_REPO_DIR=${GITHUB_WORKSPACE}/repo
          export PWNAGOTCHI_GO_BINARY=${GITHUB_WORKSPACE}/artifacts/pwnagotchi-go
          EOF
          chmod +x artifacts/pwnagotchi-go

      - name: Verify pinned kernel package availability before spending 45+ min on a build
        # Real, fast (seconds) fail-fast check against archive.raspberrypi.com's
        # actual live Packages indices — the same evidence-gathering approach
        # docs/kernel-nexmon-compatibility.md's research used manually,
        # automated here so a future drift (Raspberry Pi Foundation moving
        # bookworm's own kernel past the nexmon-compatible line, or trixie's
        # default catching up to make this pin unnecessary) is caught in
        # seconds, not after a near-hour build fails deep in 06-nexmon.
        run: |
          set -e
          curl -sf https://archive.raspberrypi.com/debian/dists/bookworm/main/binary-arm64/Packages.gz -o /tmp/bookworm-Packages.gz
          gunzip -f /tmp/bookworm-Packages.gz
          VER="$(grep -A2 '^Package: linux-image-rpi-v8$' /tmp/bookworm-Packages | awk '/^Version:/{print $2; exit}')"
          echo "bookworm linux-image-rpi-v8 candidate: ${VER:-<not found>}"
          case "$VER" in
            1:6.12.*)
              echo "OK: bookworm still serves a 6.12.x kernel, the pin in deploy/pi-gen-stage/05a-pin-kernel/ should still apply cleanly."
              ;;
            *)
              echo "::error::bookworm's linux-image-rpi-v8 is '${VER:-missing}', not a 1:6.12.x version — the kernel pin this build depends on (see docs/kernel-nexmon-compatibility.md) is stale. Re-investigate before running the full build; do not just retry."
              exit 1
              ;;
          esac

      - name: Clear stale custom-stage cache (real bug, confirmed via a failed CI run)
        # REAL BUG FOUND HERE: the actions/cache step above keys
        # pi-gen/work SOLELY on the pinned pi-gen commit + RELEASE —
        # never on anything in this repo's own deploy/pi-gen-stage. A
        # cache hit therefore restores whatever pi-gen-stage/export-image
        # rootfs a PAST run last wrote there, even across completely
        # unrelated commits of our own code, and our own stage's
        # prerun.sh (`if [ ! -d "${ROOTFS_DIR}" ]; then copy_previous;
        # fi`) skips copying a fresh rootfs forward from stage2 when one
        # already "exists" from that stale cache restore — real evidence:
        # a CI run on this exact codebase (post-migration, zero Python
        # left in the actual source) failed image validation's Python-
        # residue checks with /opt/pwnagotchi-src and pip3 BOTH present,
        # neither of which anything in this repo's own pi-gen-stage
        # installs or creates — the only explanation consistent with a
        # from-scratch build is a leftover rootfs from a much older,
        # pre-migration (Python-era) cache entry the key never
        # invalidated. This exact class of bug was already found and
        # worked around locally earlier (manually clearing this same
        # directory before every local rebuild) — this applies the same
        # fix to CI. stage0/1/2 stay cached (debootstrap + base packages
        # are genuinely independent of our own code and safe to reuse).
        run: |
          sudo rm -rf pi-gen/work/pwnagotchi/pi-gen-stage pi-gen/work/pwnagotchi/export-image

      - name: Build image (pi-gen / build.sh)
        working-directory: pi-gen
        run: |
          chmod +x build.sh
          sudo ./build.sh

      - name: Fix pi-gen/work ownership for cache save
        # build.sh runs under sudo, so everything under pi-gen/work ends
        # up root-owned; actions/cache's post-job save step runs as the
        # normal runner user and can't read root-owned files, which would
        # make the cache above silently useless. Runs even when the build
        # step failed (e.g. our own custom stage) so stage0-2's already
        # -completed rootfs still gets cached for the next iteration.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" pi-gen/work

      - name: Validate image contents (kernel pin, nexmon, services, plugins)
        # Real, no-Pi-hardware-needed verification that build.sh's
        # success actually produced what deploy/docs/kernel-nexmon-
        # -compatibility.md claims — a successful image build alone is
        # not proof of anything about its contents. This runner is a
        # real VM (unlike the sandbox that designed this pipeline, which
        # has no working loop devices at all — see deploy/README.md's
        # own notes on that), so real losetup + chroot works here.
        # Fails the job if anything checked comes back wrong; results
        # are also uploaded as an artifact below regardless.
        run: |
          set -x
          IMG_XZ="$(ls pi-gen/deploy/*.img.xz | head -1)"
          xzcat "$IMG_XZ" > /tmp/validate.img
          sudo losetup -fP /tmp/validate.img
          LOOPDEV="$(losetup -j /tmp/validate.img | cut -d: -f1)"
          sudo partprobe "$LOOPDEV" || true
          sleep 1
          BOOT_MNT=/tmp/validate-boot
          ROOT_MNT=/tmp/validate-root
          sudo mkdir -p "$BOOT_MNT" "$ROOT_MNT"
          sudo mount -o ro "${LOOPDEV}p1" "$BOOT_MNT"
          # REAL BUG FIXED HERE: mounting rootfs read-only broke `dkms
          # status` (needs to write temp files under /tmp) and gave a
          # false "read-only file system" failure for pwnagotchi-go
          # plugins doctor (writes /etc/pwnagotchi/default.toml on first
          # run). This is a disposable loop-mounted copy for validation
          # only — mounting it read-write never touches the real image
          # artifact on disk, and everything is discarded after umount
          # below. Confirmed via a real local run: this exact mount mode
          # was the actual cause, not a real image defect.
          sudo mount "${LOOPDEV}p2" "$ROOT_MNT"
          sudo mount -t proc proc "$ROOT_MNT/proc"
          sudo mount -t sysfs sysfs "$ROOT_MNT/sys"

          REPORT=/tmp/image-validation-report.txt
          FAIL=0
          check() {
            local desc="$1"; shift
            if "$@" >>"$REPORT" 2>&1; then
              echo "PASS: ${desc}" | tee -a "$REPORT"
            else
              echo "FAIL: ${desc}" | tee -a "$REPORT"
              FAIL=1
            fi
          }
          run_chroot() {
            sudo chroot "$ROOT_MNT" /bin/bash -c "$1"
          }
          # REAL BUG FIXED HERE: every `check "..." bash -c "run_chroot
          # ..."` call below runs run_chroot in a NEW subshell, which
          # can't see a function defined in the parent shell unless it's
          # exported — every one of those checks was failing with
          # "run_chroot: command not found" regardless of the image's
          # actual state, confirmed via a real local run showing this
          # exact error for every affected check.
          export -f run_chroot
          export ROOT_MNT

          {
            echo "=== image validation report ==="
            date -u
            echo
            echo "=== dpkg-query: kernel/header package versions ==="
          } >>"$REPORT"
          run_chroot "dpkg-query -W -f='\${Package} \${Version}\n' linux-image-rpi-v8 linux-image-rpi-2712 linux-headers-rpi-v8 linux-headers-rpi-2712" >>"$REPORT" 2>&1 || true

          KVER_OK=1
          run_chroot "dpkg-query -W -f='\${Version}' linux-image-rpi-v8" | grep -q '^1:6\.12\.' || KVER_OK=0
          if [ "$KVER_OK" = 1 ]; then
            echo "PASS: linux-image-rpi-v8 installed version is in the pinned 6.12.x line" | tee -a "$REPORT"
          else
            echo "FAIL: linux-image-rpi-v8 installed version is NOT in the pinned 6.12.x line" | tee -a "$REPORT"
            FAIL=1
          fi

          {
            echo
            echo "=== apt-mark showhold ==="
          } >>"$REPORT"
          run_chroot "apt-mark showhold" >>"$REPORT" 2>&1
          check "at least one linux-image-* package is held" bash -c "run_chroot 'apt-mark showhold' | grep -q linux-image"

          {
            echo
            echo "=== dkms status ==="
          } >>"$REPORT"
          run_chroot "dkms status" >>"$REPORT" 2>&1
          check "brcmfmac-nexmon shows installed in dkms status" bash -c "run_chroot 'dkms status' | grep -qi brcmfmac-nexmon"

          {
            echo
            echo "=== brcmfmac.ko module search + modinfo ==="
          } >>"$REPORT"
          MODPATH="$(run_chroot "find /lib/modules -name 'brcmfmac.ko*' 2>/dev/null | head -1")"
          echo "module path: ${MODPATH:-<none>}" >>"$REPORT"
          if [ -n "$MODPATH" ]; then
            run_chroot "modinfo '$MODPATH'" >>"$REPORT" 2>&1
          fi
          check "brcmfmac.ko exists in the image" bash -c "[ -n '$MODPATH' ]"
          check "brcmfmac.ko self-identifies as nexmon-patched" bash -c "[ -n '$MODPATH' ] && run_chroot \"modinfo '$MODPATH'\" | grep -qi nexmon"

          {
            echo
            echo "=== systemd service enablement ==="
          } >>"$REPORT"
          for svc in bettercap.service pwngrid-peer.service pwnagotchi.service; do
            run_chroot "systemctl is-enabled $svc" >>"$REPORT" 2>&1
            check "${svc} is enabled" bash -c "run_chroot 'systemctl is-enabled $svc' | grep -q enabled"
          done

          {
            echo
            echo "=== validate-nexmon-runtime script present ==="
          } >>"$REPORT"
          check "validate-nexmon-runtime is installed" sudo test -x "${ROOT_MNT}/usr/local/bin/validate-nexmon-runtime"

          {
            echo
            echo "=== native plugin doctor: validate every bundled/installed plugin (no hardware, no Python) ==="
          } >>"$REPORT"
          run_chroot "/usr/bin/pwnagotchi-go plugins doctor" >>"$REPORT" 2>&1
          check "pwnagotchi-go plugins doctor reports all checks passed" bash -c "run_chroot '/usr/bin/pwnagotchi-go plugins doctor' | grep -q 'DOCTOR: all checks passed'"

          {
            echo
            echo "=== negative check: no Python residue in the image ==="
          } >>"$REPORT"
          check "no .py files anywhere in the image" bash -c "! sudo find '$ROOT_MNT' -name '*.py' -print -quit | grep -q ."
          check "no python3 interpreter installed" bash -c "! sudo test -x '$ROOT_MNT/usr/bin/python3'"
          check "no pip installed" bash -c "! run_chroot 'command -v pip3' >/dev/null 2>&1"
          check "no /opt/pwnagotchi-src (legacy Python source tree)" bash -c "! sudo test -d '$ROOT_MNT/opt/pwnagotchi-src'"

          sudo umount "$ROOT_MNT/proc" "$ROOT_MNT/sys"
          sudo umount "$BOOT_MNT" "$ROOT_MNT"
          sudo losetup -d "$LOOPDEV"

          echo "=========================================="  | tee -a "$REPORT"
          if [ "$FAIL" -eq 0 ]; then
            echo "ALL IMAGE VALIDATION CHECKS PASSED" | tee -a "$REPORT"
          else
            echo "ONE OR MORE IMAGE VALIDATION CHECKS FAILED" | tee -a "$REPORT"
          fi
          cp "$REPORT" image-validation-report.txt
          exit "$FAIL"

      - name: Upload image validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-validation-report
          path: image-validation-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: pwnagotchi-pi-image
          path: pi-gen/deploy/*.img.xz
          retention-days: 14

      - name: Upload build log (always, for debugging a failed run)
        # Direct build.sh (unlike build-docker.sh, which rsyncs it to
        # deploy/ itself as a convenience) writes its log to
        # $WORK_DIR/build.log, i.e. pi-gen/work/<IMG_NAME>/build.log —
        # IMG_NAME=pwnagotchi per the config written above.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pi-gen-build-log
          path: pi-gen/work/pwnagotchi/build.log
          if-no-files-found: ignore
          retention-days: 14
